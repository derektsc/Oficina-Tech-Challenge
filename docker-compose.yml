services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina_development
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oficina -d oficina_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://oficina:oficina@db:5432/oficina_development
      SECRET_KEY_BASE: local-dev-secret-key-base-change-in-production-32bytes-min
      JWT_SECRET: local-dev-jwt-secret-change-in-production
    volumes:
      - .:/app

  test:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgres://oficina:oficina@db:5432/oficina_test
      SECRET_KEY_BASE: test-secret-key-base-change-in-production-32bytes-minxx
      JWT_SECRET: test-jwt-secret
    volumes:
      - .:/app
    command: bash -c "bundle exec rails db:prepare && bundle exec rspec"
    profiles: ["test"]

volumes:
  pgdata:
